# Static quality gates for LokalBot.
#
# Runs in `--strict` mode: any violation (warning or error) fails the check.
# SwiftLint enforces file size and cyclomatic complexity; swift-complexity
# independently enforces function-level cyclomatic and cognitive complexity.
#
# Findings go through `--reporter github-actions-logging` so they land as inline
# annotations on the PR diff instead of being buried in the run log.

name: Lint

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # macos-15 ships SwiftLint via Homebrew; install only if missing.
      # Printing the version captures which one ran, which matters when a rule's
      # behavior changes between releases.
      - name: Install / verify SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  complexity:
    name: Complexity
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce cyclomatic and cognitive complexity
        uses: fummicc1/swift-complexity@5f8610dc111c95842eaa6693568a44c11280d188
        with:
          version: "1.2.0"
          paths: "LokalBot CLI"
          threshold: "22"
          config: ".swift-complexity.yml"
