      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });

          /* ============================================================
             Scene 1 (0.0–3.0) — three claims land beat-by-beat on the VO:
             "built-in processing" @0.3, "no account" @1.3,
             "no telemetry" @2.4.
             Hard-cut opacity + short long-tail power3 settle on x.
             ============================================================ */
          const CLAIMS = [
            ["#ns05-claim-1", 0.3],
            ["#ns05-claim-2", 1.3],
            ["#ns05-claim-3", 2.4],
          ];
          CLAIMS.forEach(function (c) {
            const sel = c[0];
            const at = c[1];
            tl.fromTo(
              sel,
              { opacity: 0 },
              { opacity: 1, duration: 0.08, ease: "none" },
              at
            );
            tl.fromTo(
              sel,
              { x: -36 },
              { x: 0, duration: 0.85, ease: "power3.out" },
              at
            );
          });

          /* ============================================================
             Scene 2 (3.0–4.9) — "Verify the network yourself" @3.4:
             the window rises into the right two-thirds on a smooth
             long-tail settle (no overshoot), internals cascade in.
             ============================================================ */
          tl.fromTo(
            "#ns05-win",
            { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power1.out" },
            3.38
          );
          tl.fromTo(
            "#ns05-win",
            { y: 74, scale: 0.975 },
            { y: 0, scale: 1, duration: 0.9, ease: "power3.out" },
            3.38
          );
          tl.fromTo(
            ["#ns05-header", ".ns05-row"],
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.045 },
            3.55
          );

          /* Scan line — one finite dash-flow sweep down the empty rows:
             linear translate (the scan) + linear strokeDashoffset drive
             (the dash flow), completing and vanishing on "silence." */
          tl.fromTo(
            "#ns05-scan",
            { opacity: 0 },
            { opacity: 1, duration: 0.12, ease: "none" },
            3.85
          );
          tl.fromTo(
            "#ns05-scan",
            { y: 0 },
            { y: 428, duration: 1.03, ease: "none" },
            3.85
          );
          tl.fromTo(
            "#ns05-scanline",
            { strokeDashoffset: 0 },
            { strokeDashoffset: -168, duration: 1.03, ease: "none" },
            3.85
          );
          tl.to(
            "#ns05-scan",
            { opacity: 0, duration: 0.18, ease: "power1.in" },
            4.78
          );

          /* Micro-labels pulse briefly in the margins — the app visibly
             working while the table stays empty. Finite yoyo pulses. */
          const LABS = [
            ["#ns05-lab-1", 3.95],
            ["#ns05-lab-2", 4.22],
            ["#ns05-lab-3", 4.42],
          ];
          LABS.forEach(function (l) {

            const at = l[1];
            tl.fromTo(
              sel,
              { opacity: 0 },
              { opacity: 0.95, duration: 0.14, ease: "none" },
              at
            );
            tl.to(
              sel,
              {
                opacity: 0.5,
                duration: 0.15,
                ease: "sine.inOut",
                yoyo: true,
                repeat: 1,
              },
              at + 0.17
            );
            tl.fromTo(
              sel + " .ns05-dot",
              { scale: 1 },
              {
                scale: 1.3,
                duration: 0.15,
                ease: "sine.inOut",
                yoyo: true,
                repeat: 1,
              },
              at + 0.1
            );
          });

          /* ============================================================
             Scene 3 (5.0–6.04) — the scoped result lands: everything stops.
             Labels fade, the scan is gone, and the zero row stamps in.
             Then the frame holds perfectly dead-still to the cut —
             nothing is scheduled after t = 5.32.
             ============================================================ */
          tl.to(
            ["#ns05-lab-1", "#ns05-lab-2", "#ns05-lab-3"],
            { opacity: 0, duration: 0.12, ease: "power1.in" },
            4.9
          );

          tl.fromTo(
            "#ns05-zero",
            { opacity: 0 },
            { opacity: 1, duration: 0.1, ease: "none" },
            5.06

              filter: "blur(0px)",
              duration: 0.26,
