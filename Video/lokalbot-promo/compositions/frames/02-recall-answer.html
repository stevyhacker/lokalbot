      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var DUR = 7.104;
          var tl = gsap.timeline({ paused: true });

          function g(id) {
            return document.getElementById(id) || {};
          }
          var elA = g("frame-02-recall-answer-s1a");
          var elB = g("frame-02-recall-answer-s1b");
          var stack = g("frame-02-recall-answer-stack");
          var card = g("frame-02-recall-answer-card");
          var cite = g("frame-02-recall-answer-cite");
          var world = g("frame-02-recall-answer-world");

          /* ---------- Scene 1 (0.0-2.5): statement slam + zoom-through token swap ---------- */
          /* baseline states at the clip's own start */
          tl.set(elA, { autoAlpha: 0, scale: 1, filter: "blur(0px)" }, 0);
          tl.set(elB, { autoAlpha: 0, scale: 0.75, filter: "blur(10px)" }, 0);

          /* "you forgot." hard-cuts in on the spoken word */
          tl.set(elA, { autoAlpha: 1 }, 0.1);

          /* zoom-through (forward, text-scale): exit accelerates toward viewer */
          tl.to(elA, { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 1.1);
          tl.to(elA, { opacity: 0.15, duration: 0.2, ease: "none" }, 1.1); /* opacity split, linear */

          /* hard cut at peak velocity + peak blur; values match on both sides */
          tl.set(elA, { autoAlpha: 0 }, 1.3);
          tl.set(elB, { autoAlpha: 0.15 }, 1.3);

          /* entry continues forward, decelerating into the focal plane */
          tl.to(
            elB,
            { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
            1.301
          );

          /* ---------- Scene 2 (2.5-4.7): scale-swap to the Quick Recall overlay ---------- */
          /* outgoing line rushes away (scale-swap-transition exit) */
          tl.to(elB, { scale: 0.7, autoAlpha: 0, duration: 0.32, ease: "power2.in" }, 2.5);

          /* incoming overlay: same footprint anchor, overlap 0.15s, smooth long-tail settle
             (power3.out - the two overshoot budgets live in frames 4 and 6, not here) */
          tl.set(stack, { autoAlpha: 0, scale: 0.86, y: 24 }, 2.5);
          tl.to(
            stack,
            { autoAlpha: 1, scale: 1, y: 0, duration: 0.72, ease: "power3.out" },
            2.67
          );

          /* answer card slides up beneath the bar as "answers" is spoken */
          tl.set(card, { autoAlpha: 0, y: 34 }, 2.5);
          tl.to(card, { autoAlpha: 1, y: 0, duration: 0.65, ease: "power3.out" }, 3.6);

          /* citation row hidden until "quoting the source" */
          tl.set(cite, { autoAlpha: 0, y: 14 }, 2.5);
          tl.to(cite, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" }, 6.0);

          /* ---------- camera: slow push-in toward the card (viewport-change) ----------
             single wrapper, translate(x,y) scale(S); card center sits ~+6px below
             viewport center, so T = -offset * S = -6 * 1.085 ~= -6.5. Settles by 5.5,
             then the camera is dead: no back-half drift. */
          tl.fromTo(
            world,
            { scale: 1, y: 0 },
            { scale: 1.085, y: -6.5, duration: 1.7, ease: "power2.inOut", immediateRender: false },
            3.8
          );

          /* ---------- driver: typed question, caret blink, keyword glow sweep ----------
             one linear driver over the full duration; every visual below is a pure
             function of driver.t (seek-safe, deterministic). */
          var QUESTION_SEQ = [
            [2.92, "w"],
            [2.99, "wha"],
            [3.05, "what "],
            [3.12, "what did "],
            [3.19, "what did I "],
            [3.26, "what did I agre"],
            [3.33, "what did I agree "],
            [3.39, "what did I agree to "],
            [3.46, "what did I agree to at "],
            [3.52, "what did I agree to at 9:"],
            [3.57, "what did I agree to at 9:15?"],
          ];
          function textAt(t) {
            var s = "";
            for (var i = 0; i < QUESTION_SEQ.length; i++) {
              if (t >= QUESTION_SEQ[i][0]) s = QUESTION_SEQ[i][1];
            }
            return s;
          }

          /* caret: solid while typing, deterministic hard blink once idle */
          function caretOpacity(t) {
            if (t < 3.65) return 1;
            return ((t - 3.65) % 0.9) < 0.5 ? 1 : 0;
          }

          /* asr-keyword-glow envelope: attack-sustain-decay-rest, swept left to right */
          var QUOTE_T = [
            [6.15, 6.24],
            [6.255, 6.345],
            [6.36, 6.45],
            [6.465, 6.555],
            [6.57, 6.66],
            [6.675, 6.765],
            [6.78, 6.87],
          ];
          var ATTACK = 0.08;
          var RELEASE = 0.25;
          var REST_LEVEL = 0.55;
          var REST_RGB = { r: 159, g: 178, b: 196 }; /* #9FB2C4 muted */
          var ACTIVE_RGB = { r: 239, g: 246, b: 250 }; /* #EFF6FA cream */
          function envAt(t, s, e) {
            if (t < s) return 0;
            if (t < s + ATTACK) return (t - s) / ATTACK;
            if (t < e) return 1;
            if (t < e + RELEASE) return 1 - ((t - e) / RELEASE) * (1 - REST_LEVEL);
            return REST_LEVEL;
          }
          function lerp(a, b, t) {
            return Math.round(a + (b - a) * t);
          }

          var driver = { t: 0 };
          tl.to(
            driver,
            {
              t: DUR,
              duration: DUR,
              ease: "none",
              onUpdate: function () {
                var t = driver.t;
                /* lazy lookups so a re-mounted clip clone is always the one updated */
                var qEl = document.getElementById("frame-02-recall-answer-q");
                if (qEl) qEl.textContent = textAt(t);
                var cEl = document.getElementById("frame-02-recall-answer-caret");
                if (cEl) cEl.style.opacity = caretOpacity(t);
                var words = document.querySelectorAll(".fr02ra-w");
                for (var i = 0; i < words.length; i++) {
                  var wi = parseInt(words[i].getAttribute("data-wi"), 10);
                  var win = QUOTE_T[wi];
                  if (!win) continue;
                  var env = envAt(t, win[0], win[1]);
                  words[i].style.color =
                    "rgb(" +
                    lerp(REST_RGB.r, ACTIVE_RGB.r, env) +
                    "," +
                    lerp(REST_RGB.g, ACTIVE_RGB.g, env) +
                    "," +
                    lerp(REST_RGB.b, ACTIVE_RGB.b, env) +
                    ")";
                  words[i].style.textShadow =
                    "0 0 " + (14 * env).toFixed(2) + "px rgba(35,196,174," + (0.55 * env).toFixed(3) + ")";
                  words[i].style.transform = "scale(" + (1 + 0.045 * env).toFixed(4) + ")";
                }
              },
            },
            0
          );

          window.__timelines["02-recall-answer"] = tl;
        })();
      </script>
