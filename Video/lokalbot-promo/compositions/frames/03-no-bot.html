      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var win = document.querySelector(".nb3-window");
          var recDot = document.querySelector(".nb3-recdot");
          var meRow = document.querySelector(".nb3-turn-me");
          var themRow = document.querySelector(".nb3-turn-them");
          var meBars = document.querySelectorAll(".nb3-wave-me i");
          var themBars = document.querySelectorAll(".nb3-wave-them i");
          var turnsCol = document.querySelector(".nb3-turns");
          var footTag = document.querySelector(".nb3-foottag");
          var words = document.querySelectorAll(".nb3-word");
          var cap = document.querySelector(".nb3-nobot");
          var ringRect = document.querySelector(".nb3-ring rect");

          // svg-path-draw setup: measure real geometry, park the stroke fully offset
          var ringLen = ringRect.getTotalLength() * 1.02;
          ringRect.style.strokeDasharray = ringLen;
          ringRect.style.strokeDashoffset = ringLen;

          var tl = gsap.timeline({ paused: true });

          /* Scene 1 (0.0-1.3s) - the window slides in from the right edge, settles.
             Camera static for the whole shot (static-tour variant). */
          tl.fromTo(
            win,
            { x: 1170 },
            { x: 0, duration: 1.0, ease: "power3.out" },
            0.02
          );

          // the amber REC dot pulses exactly once, then stays static
          tl.fromTo(
            recDot,
            { scale: 1 },
            { scale: 1.45, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 1 },
            0.78
          );

          // "both sides" @0.9 - first speaker turn reveals
          tl.fromTo(
            meRow,
            { y: 26, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" },
            0.9
          );
          tl.fromTo(
            meBars,
            { scaleY: 0.12 },
            { scaleY: 1, duration: 0.45, ease: "power3.out", stagger: 0.03 },
            0.98
          );

          /* Scene 2 (1.3-2.6s) - the turns cycle: Me slides up + dims, Them pushes in
             beneath (element-level content cycling inside the held hero surface). */
          tl.fromTo(
            footTag,
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.5, ease: "power2.out" },
            1.45
          );
          tl.fromTo(
            turnsCol,
            { y: 0 },
            { y: -68, duration: 0.6, ease: "power3.inOut" },
            1.6
          );
          tl.fromTo(
            meRow,
            { opacity: 1 },
            { opacity: 0.4, duration: 0.5, ease: "power2.out", immediateRender: false },
            1.6
          );
          tl.fromTo(
            themRow,
            { y: 26, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" },
            1.64
          );
          tl.fromTo(
            themBars,
            { scaleY: 0.12 },
            { scaleY: 1, duration: 0.45, ease: "power3.out", stagger: 0.03 },
            1.74
          );

          /* Scene 3 (2.6-4.29s) - "Nothing joins" @2.7: per-word staggered reveal
             in the quiet left third; then NO BOT stamps under the empty slot as a
             teal hairline draws around it. Dead still from ~3.55 to the cut. */
          tl.fromTo(
            words,
            { y: 42, autoAlpha: 0 },
            { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out", stagger: 0.16 },
            2.7
          );
          tl.fromTo(
            cap,
            { scale: 1.3, autoAlpha: 0 },
            { scale: 1, autoAlpha: 1, duration: 0.32, ease: "power3.out" },
            3.1
          );
          tl.fromTo(
            ringRect,
            { strokeDashoffset: ringLen },
            { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
            3.12
          );

          window.__timelines["03-no-bot"] = tl;
        })();
